<title>For my heroine</title>
<style>
  :root{

  }

  .mood{flex-shrink:0;height:38px;padding:0 15px;border-radius:19px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer}
  .mood.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .row{display:flex;gap:8px;margin-top:10px;align-items:center}
  .seg{flex:1;min-width:0;display:flex;background:var(--tint);border-radius:10px;padding:3px}
  .seg button{flex:1;height:34px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  select{height:40px;border:0;border-radius:10px;background:var(--tint);color:var(--ink);font-family:inherit;font-size:16px;font-weight:500;padding:0 10px;-webkit-appearance:none;appearance:none}
  .search{flex:1;min-width:0;width:100%;height:42px;border:0;border-radius:10px;background:var(--tint);color:var(--ink);font-family:inherit;font-size:16px;padding:0 14px;-webkit-appearance:none}
  .search:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .surprise{height:42px;padding:0 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}

  .status{display:flex;justify-content:space-between;align-items:center;color:var(--soft);font-size:14px;padding:16px 4px 4px}
  .status label{display:flex;align-items:center;gap:8px;cursor:pointer}
  .status input{width:20px;height:20px;accent-color:var(--accent)}

  h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--soft);padding:26px 4px 8px}
  .list{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .item{padding:16px;border-top:1px solid var(--line);display:flex;gap:14px;transition:background .3s}
  .item:first-child{border-top:0}
  .item.flash{background:var(--accent-soft)}
  .check{flex-shrink:0;width:30px;height:30px;margin-top:1px;border-radius:50%;border:2px solid #cfc7bc;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .check svg{width:16px;height:16px;opacity:0}
  .item.done .check{background:var(--accent);border-color:var(--accent)}
  .item.done .check svg{opacity:1}
  .body{flex:1;min-width:0}
  .title{font-size:18px;font-weight:600;line-height:1.25}
  .year{font-weight:400;color:var(--soft)}
  .item.done .title{color:var(--soft);text-decoration:line-through}
  .meta{font-size:14px;color:var(--soft);margin-top:2px}
  .heavy{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;margin-top:6px}
  .blurb{font-size:15.5px;margin-top:6px;color:#3a3633}
  .item.done .blurb{color:var(--soft)}
  .foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .score{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:8px;background:var(--tint);color:var(--ink);font-size:14px;font-weight:600;text-decoration:none}
  .score small{font-size:11px;font-weight:700;color:var(--soft)}
  .svc{font-size:13px;color:var(--soft)}
  .watch{margin-left:auto;display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;text-decoration:none}
  .empty{text-align:center;color:var(--soft);padding:50px 0}
  footer{text-align:center;color:#a39b91;font-size:12px;padding:30px 10px 0;line-height:1.5}
</style>
</head>
<body>
<div class="page">
  <h1>Here's a movie list for my heroine.</h1>

  <div class="bar">

      </div>

        <option value="">By mood</option>
        <option value="i">Top IMDb</option>
        <option value="r">Top RT</option>
      </select>
    </div>
    <div class="row">
      <input class="search" id="search" type="search" placeholder="Search" autocomplete="off">
      <button class="surprise" id="pick">Surprise me</button>
    </div>
  </div>

  <div class="status">
    <span id="tally"></span>
    <label><input type="checkbox" id="hide"> Hide watched</label>
  </div>

  <div id="list"></div>
  <p class="empty" id="empty" hidden>Nothing here. Try another filter.</p>

  <footer>Ratings are approximate (IMDb out of 10, Rotten Tomatoes critics' score).<br>"Watch" opens JustWatch India for current streaming options.</footer>
</div>

  {t:"Notting Hill",y:"1999",k:"M",g:"Romantic comedy",m:"Romance & comedy",i:"7.2",r:"84%",b:"A London bookshop owner and the most famous film star in the world."},
  {t:"The Nice Guys",y:"2016",k:"M",g:"Crime comedy",m:"Romance & comedy",i:"7.4",r:"92%",b:"Two mismatched private eyes stumble through a case in 70s LA. Very funny."},
  {t:"Ted Lasso",y:"2020–",k:"S",g:"Feel-good comedy",m:"Romance & comedy",i:"8.8",r:"90%",b:"An American football coach somehow ends up managing an English soccer team. Pure warmth.",s:A}
];


const TICK = `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("watched") || "[]"); } catch(e){ return []; } },
  set(v){ try { localStorage.setItem("watched", JSON.stringify(v)); } catch(e){} }
};
let watched = new Set(store.get());
let mood = "All", kind = "";
const $ = id => document.getElementById(id);
const enc = s => encodeURIComponent(s);

MOODS.forEach(m => {
  const b = document.createElement("button");
  b.className = "mood" + (m === mood ? " on" : "");
  b.textContent = m;
  b.onclick = () => { mood = m; document.querySelectorAll(".mood").forEach(x => x.classList.toggle("on", x === b)); render(); window.scrollTo({top:0, behavior:"smooth"}); };
  $("moods").appendChild(b);
});
document.querySelectorAll("#kinds button").forEach(b => b.onclick = () => {
  kind = b.dataset.k;
  document.querySelectorAll("#kinds button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

function item(x, i){
  const q = x.q || x.t, yr = x.y.slice(0,4);
  return `<div class="item${watched.has(x.t) ? " done" : ""}" data-i="${i}">
    <button class="check" aria-label="Mark ${x.t} as watched">${TICK}</button>
    <div class="body">
      <div class="title">${x.t} <span class="year">${x.y}</span></div>
      <div class="meta">${x.k === "S" ? "Show" : "Movie"} · ${x.g}</div>
      ${x.x ? `<span class="heavy">Heavy watch</span>` : ""}
      <p class="blurb">${x.b}</p>
      <div class="foot">
        <a class="score" href="https://www.imdb.com/find/?q=${enc(q + " " + yr)}" target="_blank" rel="noopener"><small>IMDb</small>${x.i}</a>
        <a class="score" href="https://www.rottentomatoes.com/search?search=${enc(q)}" target="_blank" rel="noopener"><small>RT</small>${x.r}</a>
        ${x.s ? `<span class="svc">${x.s}</span>` : ""}
        <a class="watch" href="https://www.justwatch.com/in/search?q=${enc(q)}" target="_blank" rel="noopener">Watch</a>
      </div>
    </div>
  </div>`;
}

function visible(){
  const s = $("search").value.trim().toLowerCase(), hide = $("hide").checked;
  return TITLES.map((x,i) => ({x,i})).filter(({x}) =>
    (mood === "All" || x.m === mood) && (!kind || x.k === kind) &&
    (!s || (x.t + " " + x.g + " " + x.m).toLowerCase().includes(s)) &&
    (!hide || !watched.has(x.t)));
}

function render(){
  const vis = visible(), sort = $("sort").value;
  let html = "";
  if (sort) {
    vis.sort((a,b) => parseFloat(b.x[sort]) - parseFloat(a.x[sort]));
    html = `<h2>Highest rated</h2><div class="list">${vis.map(v => item(v.x, v.i)).join("")}</div>`;
  } else {
    MOODS.slice(1).forEach(m => {
      const g = vis.filter(v => v.x.m === m);
      if (g.length) html += `<h2>${m} · ${g.length}</h2><div class="list">${g.map(v => item(v.x, v.i)).join("")}</div>`;
    });
  }
  $("list").innerHTML = html;
  $("empty").hidden = vis.length > 0;
  const done = TITLES.filter(x => watched.has(x.t)).length;
  $("tally").textContent = `${done} of ${TITLES.length} watched`;
}

$("list").addEventListener("click", e => {
  const b = e.target.closest(".check"); if (!b) return;
  const x = TITLES[b.closest(".item").dataset.i];
  watched.has(x.t) ? watched.delete(x.t) : watched.add(x.t);
  store.set([...watched]); render();
});
$("search").addEventListener("input", render);
$("hide").addEventListener("change", render);
$("sort").addEventListener("change", render);
$("pick").addEventListener("click", () => {
  let pool = visible().filter(v => !watched.has(v.x.t));
  if (!pool.length) pool = visible();
  if (!pool.length) return;
  const p = pool[Math.floor(Math.random() * pool.length)];
  const el = document.querySelector(`.item[data-i="${p.i}"]`);
  el.scrollIntoView({behavior:"smooth", block:"center"});
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 2200);
});

render();
</script>
</body>
</html>
